openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: myaiteacher API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: dashboard
    description: Student dashboard operations
  - name: subjects
    description: Subject detail operations
  - name: knowledge
    description: Knowledge tree operations
  - name: lessons
    description: Lesson operations
  - name: chat
    description: AI tutor chat operations
  - name: progress
    description: Student progress and knowledge map operations
  - name: homework
    description: Homework management operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input or username taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/profile:
    get:
      operationId: getProfile
      tags: [auth]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get student dashboard data
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardData"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/progress:
    get:
      operationId: getProgress
      tags: [dashboard]
      summary: Get all subject progress for the current student
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of subject progress
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubjectProgress"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent lesson activity for the current student
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recent activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LessonActivity"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /subjects:
    get:
      operationId: getSubjects
      tags: [subjects]
      summary: Get all subjects list
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of subjects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubjectListItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /subjects/{subjectId}:
    get:
      operationId: getSubjectDetail
      tags: [subjects]
      summary: Get subject detail with lessons
      security:
        - bearerAuth: []
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Subject detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Subject not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /subjects/{subjectId}/start-lesson:
    post:
      operationId: startLesson
      tags: [subjects]
      summary: Start or update a lesson for the current student
      security:
        - bearerAuth: []
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartLessonInput"
      responses:
        "200":
          description: Lesson started or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonActivity"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /knowledge-tree/{subjectId}:
    get:
      operationId: getKnowledgeTree
      tags: [knowledge]
      summary: Get knowledge tree topics for a subject
      security:
        - bearerAuth: []
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Knowledge tree data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeTreeData"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Subject not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lessons:
    post:
      operationId: createLesson
      tags: [lessons]
      summary: Create a new lesson for a subject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLessonInput"
      responses:
        "201":
          description: Lesson created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewLesson"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lessons/{lessonId}:
    get:
      operationId: getLessonDetail
      tags: [lessons]
      summary: Get lesson detail with 8 phases and Bloom levels
      security:
        - bearerAuth: []
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lesson detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Lesson not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lessons/start:
    post:
      operationId: startLessonSession
      tags: [lessons]
      summary: Start a lesson session (8 phases)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartLessonSessionInput"
      responses:
        "201":
          description: Lesson session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonSession"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lessons/{lessonId}/delete:
    post:
      operationId: deleteLesson
      tags: [lessons]
      summary: Delete a lesson (and all its sessions and homework)
      security:
        - bearerAuth: []
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lesson deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Lesson not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lessons/{lessonId}/advance-phase:
    post:
      operationId: advanceLessonPhase
      tags: [lessons]
      summary: Advance to the next phase in a lesson session
      security:
        - bearerAuth: []
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Phase advanced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonSession"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chat:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message to the AI tutor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: AI tutor response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chat/history:
    get:
      operationId: getChatHistory
      tags: [chat]
      summary: Get chat history for a lesson
      security:
        - bearerAuth: []
      parameters:
        - name: lessonId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Chat history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessageItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /books:
    get:
      operationId: getBooks
      tags: [books]
      summary: List all books uploaded by the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{bookId}:
    get:
      operationId: getBook
      tags: [books]
      summary: Get a single book
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Book detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{bookId}/generate-lessons:
    post:
      operationId: generateLessons
      tags: [books]
      summary: Generate lessons from an uploaded book using AI
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated lessons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookGenerationResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /progress:
    get:
      operationId: getProgress
      tags: [progress]
      summary: Get overall progress for the current student
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Overall progress summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverallProgress"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /progress/subject/{subjectId}:
    get:
      operationId: getSubjectProgress
      tags: [progress]
      summary: Get detailed lesson-level progress for a subject
      security:
        - bearerAuth: []
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Subject progress detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectProgressDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Subject not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /progress/recommendations:
    get:
      operationId: getProgressRecommendations
      tags: [progress]
      summary: Get AI-powered learning recommendations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: AI recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressRecommendations"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /homework:
    get:
      operationId: getHomework
      tags: [homework]
      summary: List all homework for the current student
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of homework assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HomeworkItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /homework/{homeworkId}:
    get:
      operationId: getHomeworkById
      tags: [homework]
      summary: Get a single homework assignment with details
      security:
        - bearerAuth: []
      parameters:
        - name: homeworkId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Homework detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeworkDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /homework/{homeworkId}/submit:
    post:
      operationId: submitHomework
      tags: [homework]
      summary: Submit answer for a homework assignment
      security:
        - bearerAuth: []
      parameters:
        - name: homeworkId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomeworkSubmitInput"
      responses:
        "200":
          description: Homework submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeworkDetail"
        "400":
          description: Invalid input or already submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /homework/{homeworkId}/grade:
    post:
      operationId: gradeHomework
      tags: [homework]
      summary: Grade a submitted homework (teacher or AI-assisted)
      security:
        - bearerAuth: []
      parameters:
        - name: homeworkId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomeworkGradeInput"
      responses:
        "200":
          description: Homework graded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeworkDetail"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /homework/{homeworkId}/ai-grade-suggest:
    post:
      operationId: aiGradeSuggest
      tags: [homework]
      summary: Ask AI for a grading suggestion for a submitted homework
      security:
        - bearerAuth: []
      parameters:
        - name: homeworkId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: AI grading suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiGradeSuggestion"
        "400":
          description: Homework not submitted yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    RegisterInput:
      type: object
      required: [username, password, fullName]
      properties:
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 6
        fullName:
          type: string
          minLength: 1

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"

    UserProfile:
      type: object
      required: [id, username, fullName, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        fullName:
          type: string
        createdAt:
          type: string
          format: date-time

    SubjectProgress:
      type: object
      required: [id, subject, completedLessons, totalLessons, averageScore, progressPercent]
      properties:
        id:
          type: integer
        subject:
          type: string
        completedLessons:
          type: integer
        totalLessons:
          type: integer
        averageScore:
          type: number
        progressPercent:
          type: number

    LessonActivity:
      type: object
      required: [id, subject, lesson, score, status, createdAt]
      properties:
        id:
          type: integer
        subject:
          type: string
        lesson:
          type: string
        score:
          type: integer
        status:
          type: string
        createdAt:
          type: string
          format: date-time

    DashboardStats:
      type: object
      required: [completedLessons, averageScore, pendingHomework, overallProgress]
      properties:
        completedLessons:
          type: integer
        averageScore:
          type: number
        pendingHomework:
          type: integer
        overallProgress:
          type: number

    DashboardData:
      type: object
      required: [stats, subjects, recentActivity]
      properties:
        stats:
          $ref: "#/components/schemas/DashboardStats"
        subjects:
          type: array
          items:
            $ref: "#/components/schemas/SubjectProgress"
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/LessonActivity"

    SubjectListItem:
      type: object
      required: [id, name, grade, description]
      properties:
        id:
          type: integer
        name:
          type: string
        grade:
          type: string
        description:
          type: string

    LessonItem:
      type: object
      required: [id, lesson, score, status, createdAt]
      properties:
        id:
          type: integer
        lesson:
          type: string
        score:
          type: integer
        status:
          type: string
        createdAt:
          type: string
          format: date-time

    SubjectDetail:
      type: object
      required: [id, name, grade, description, progressPercent, completedLessons, totalLessons, averageScore, lessons]
      properties:
        id:
          type: integer
        name:
          type: string
        grade:
          type: string
        description:
          type: string
        progressPercent:
          type: number
        completedLessons:
          type: integer
        totalLessons:
          type: integer
        averageScore:
          type: number
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/LessonItem"

    StartLessonInput:
      type: object
      required: [lesson]
      properties:
        lesson:
          type: string
        score:
          type: integer
        status:
          type: string

    KnowledgeTopic:
      type: object
      required: [id, topicName, score, status, masteryLevel]
      properties:
        id:
          type: integer
        topicName:
          type: string
        score:
          type: integer
        status:
          type: string
        masteryLevel:
          type: string
          enum: [mastered, weak, not_started]

    AIRecommendation:
      type: object
      required: [type, message, topicName]
      properties:
        type:
          type: string
          enum: [start, review, repeat]
        message:
          type: string
        topicName:
          type: string

    KnowledgeTreeData:
      type: object
      required: [subjectId, subjectName, topics, recommendations]
      properties:
        subjectId:
          type: integer
        subjectName:
          type: string
        topics:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeTopic"
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/AIRecommendation"

    LessonPhase:
      type: object
      required: [phase, title, duration, description, activities]
      properties:
        phase:
          type: integer
        title:
          type: string
        duration:
          type: string
        description:
          type: string
        activities:
          type: array
          items:
            type: string

    BloomLevel:
      type: object
      required: [level, name, color, description]
      properties:
        level:
          type: integer
        name:
          type: string
        color:
          type: string
        description:
          type: string

    LessonDetail:
      type: object
      required: [id, subjectId, subjectName, title, description, bloomLevel, bloomLevels, phases, currentSession]
      properties:
        id:
          type: integer
        subjectId:
          type: integer
        subjectName:
          type: string
        title:
          type: string
        description:
          type: string
        bloomLevel:
          type: integer
        bloomLevels:
          type: array
          items:
            $ref: "#/components/schemas/BloomLevel"
        phases:

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: myaiteacher API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: dashboard
    description: Student dashboard operations
  - name: subjects
    description: Subject detail operations
  - name: knowledge
    description: Knowledge tree operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input or username taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/profile:
    get:
      operationId: getProfile
      tags: [auth]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get student dashboard data
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardData"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/progress:
    get:
      operationId: getProgress
      tags: [dashboard]
      summary: Get all subject progress for the current student
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of subject progress
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubjectProgress"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent lesson activity for the current student
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recent activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LessonActivity"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /subjects:
    get:
      operationId: getSubjects
      tags: [subjects]
      summary: Get all subjects list
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of subjects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubjectListItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /subjects/{subjectId}:
    get:
      operationId: getSubjectDetail
      tags: [subjects]
      summary: Get subject detail with lessons
      security:
        - bearerAuth: []
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Subject detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Subject not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /subjects/{subjectId}/start-lesson:
    post:
      operationId: startLesson
      tags: [subjects]
      summary: Start or update a lesson for the current student
      security:
        - bearerAuth: []
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartLessonInput"
      responses:
        "200":
          description: Lesson started or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonActivity"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /knowledge-tree/{subjectId}:
    get:
      operationId: getKnowledgeTree
      tags: [knowledge]
      summary: Get knowledge tree topics for a subject
      security:
        - bearerAuth: []
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Knowledge tree data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeTreeData"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Subject not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    RegisterInput:
      type: object
      required: [username, password, fullName]
      properties:
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 6
        fullName:
          type: string
          minLength: 1

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"

    UserProfile:
      type: object
      required: [id, username, fullName, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        fullName:
          type: string
        createdAt:
          type: string
          format: date-time

    SubjectProgress:
      type: object
      required: [id, subject, completedLessons, totalLessons, averageScore, progressPercent]
      properties:
        id:
          type: integer
        subject:
          type: string
        completedLessons:
          type: integer
        totalLessons:
          type: integer
        averageScore:
          type: number
        progressPercent:
          type: number

    LessonActivity:
      type: object
      required: [id, subject, lesson, score, status, createdAt]
      properties:
        id:
          type: integer
        subject:
          type: string
        lesson:
          type: string
        score:
          type: integer
        status:
          type: string
        createdAt:
          type: string
          format: date-time

    DashboardStats:
      type: object
      required: [completedLessons, averageScore, pendingHomework, overallProgress]
      properties:
        completedLessons:
          type: integer
        averageScore:
          type: number
        pendingHomework:
          type: integer
        overallProgress:
          type: number

    DashboardData:
      type: object
      required: [stats, subjects, recentActivity]
      properties:
        stats:
          $ref: "#/components/schemas/DashboardStats"
        subjects:
          type: array
          items:
            $ref: "#/components/schemas/SubjectProgress"
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/LessonActivity"

    SubjectListItem:
      type: object
      required: [id, name, grade, description]
      properties:
        id:
          type: integer
        name:
          type: string
        grade:
          type: string
        description:
          type: string

    LessonItem:
      type: object
      required: [id, lesson, score, status, createdAt]
      properties:
        id:
          type: integer
        lesson:
          type: string
        score:
          type: integer
        status:
          type: string
        createdAt:
          type: string
          format: date-time

    SubjectDetail:
      type: object
      required: [id, name, grade, description, progressPercent, completedLessons, totalLessons, averageScore, lessons]
      properties:
        id:
          type: integer
        name:
          type: string
        grade:
          type: string
        description:
          type: string
        progressPercent:
          type: number
        completedLessons:
          type: integer
        totalLessons:
          type: integer
        averageScore:
          type: number
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/LessonItem"

    StartLessonInput:
      type: object
      required: [lesson]
      properties:
        lesson:
          type: string
        score:
          type: integer
        status:
          type: string

    KnowledgeTopic:
      type: object
      required: [id, topicName, score, status, masteryLevel]
      properties:
        id:
          type: integer
        topicName:
          type: string
        score:
          type: integer
        status:
          type: string
        masteryLevel:
          type: string
          enum: [mastered, weak, not_started]

    AIRecommendation:
      type: object
      required: [type, message, topicName]
      properties:
        type:
          type: string
          enum: [start, review, repeat]
        message:
          type: string
        topicName:
          type: string

    KnowledgeTreeData:
      type: object
      required: [subjectId, subjectName, topics, recommendations]
      properties:
        subjectId:
          type: integer
        subjectName:
          type: string
        topics:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeTopic"
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/AIRecommendation"
